[project]
name = "geotech-satellite"
version = "1.0.0"
description = "Automated preliminary geotechnical desk study from open satellite/geospatial data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117",
    "httpx>=0.27",
    "reportlab>=4.1",
    "pydantic>=2.6",
]

# Vercel FastAPI framework preset: point to the ASGI `app` in backend/main.py
[tool.vercel]
entrypoint = "backend.main:app"
